<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap');
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    background: transparent;
    font-family: 'Hind Siliguri', 'Nirmala UI', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 80px 40px;
    box-sizing: border-box;
  }
  .top-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .badge {
    background: #F5B041;
    color: #000;
    font-size: 28px;
    font-weight: 700;
    padding: 8px 30px;
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .title-card {
    background: rgba(15, 23, 42, 0.85);
    border: 2px solid rgba(245, 176, 65, 0.6);
    color: #ffffff;
    font-size: 46px;
    font-weight: 700;
    padding: 20px 40px;
    border-radius: 20px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .bottom-card {
    background: rgba(15, 23, 42, 0.85);
    border: 1.5px solid rgba(245, 176, 65, 0.5);
    color: #F5B041;
    font-size: 34px;
    font-weight: 600;
    padding: 15px 35px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class='top-box'>
    <div class='badge'>ঈমান নসিহত</div>
    <div class='title-card'>জীবনে বরকত ও রিজিক বৃদ্ধির আমল</div>
  </div>
  <div class='bottom-card'>— সুনানে আবু দাউদ : ১৫১৮</div>
</body>
</html>
