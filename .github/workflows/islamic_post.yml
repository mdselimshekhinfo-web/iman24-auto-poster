name: 🌙 ঈমান — Daily Islamic Post

on:
  schedule:
    # Bangladesh Time (UTC+6):
    # 01:00 UTC = 7:00 AM BD (Hadith)
    # 07:00 UTC = 1:00 PM BD (Quran)
    # 13:00 UTC = 7:00 PM BD (Dua)
    - cron: '0 1 * * *'
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      post_slot:
        description: 'Post slot (1=hadith, 2=quran, 3=dua)'
        required: false
        default: '1'

jobs:
  islamic_post:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔤 Install Bengali font & ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-beng fonts-beng-extra fonts-noto-core fonts-noto-extra libraqm0 libraqm-dev libfribidi0 libfribidi-dev libharfbuzz0b libharfbuzz-dev 2>/dev/null || true
          fc-cache -fv 2>/dev/null || true
          echo "✅ Bengali fonts and ffmpeg installed"

      - name: 🌙 Run Islamic Auto Poster
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_SLOT: ${{ github.event.inputs.post_slot || '1' }}
        run: python main.py
